<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Treatment History</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <style>
            .header {
                background-color: #313866;
                padding-left: 15px;
                width: 100vw;
                /* top: 0; */
                /* position: fixed; */
                margin-top: 0px;
                color: white;
                filter: drop-shadow(2px 2px 3px rgba(0, 0, 0, 0.8));
                font-family: "Montserrat", sans-serif;
                display: flex;
                justify-content: space-between;
                }

            .footer {
                background-color: #313866;
                position: fixed;
                bottom: 0;
                color: white;
                text-align: center;
                }
        </style>
    </head>

    <body>
        <!-- Header  -->
        <div class = 'navbar-brand header' style="color: white">
            LDH Hospital
        </div>

        <!-- Main body  -->        
        <div style = "height: 500px" class="d-flex justify-content-center align-items-center text-center">
            <div>
                <p>Hi {{ patient.name }},</p>
                <p>Please find your Treatment History report attached.</p>
            </div>
        </div>

        <div class = "d-flex justify-content-end">
            <p class = "p-2">Report generated at {{ now }}</p>
        </div>

        <!-- Footer  -->
        <div>
            <p class = 'footer m-0 w-100'>&copy;  2026 LDH Hospital</p>
        </div>
    </body>
</html>
